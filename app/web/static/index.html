<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StoryWorld · AI 互动小说</title>
<style>
  :root { --bg:#0f1117; --panel:#171a23; --bubble:#232838; --accent:#7c5cff; --text:#e8eaf2; --dim:#9aa3b5; --ok:#3ddc97; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; height:100vh; display:flex; flex-direction:column; }
  #topbar { padding:10px 16px; background:var(--panel); border-bottom:1px solid #262b3a; display:flex; align-items:center; gap:10px; }
  #topbar h1 { font-size:16px; }
  #convTitle { color:var(--dim); font-size:13px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #meBadge { font-size:12px; color:var(--dim); }
  button.ghost { background:none; border:1px solid #3a4155; color:var(--text); border-radius:8px; padding:4px 10px; font-size:12px; cursor:pointer; }
  button.ghost:hover { border-color:var(--accent); }
  #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:78%; padding:10px 12px; border-radius:12px; line-height:1.65; font-size:14px; white-space:pre-wrap; word-break:break-word; }
  .msg.user { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
  .msg.bot { align-self:flex-start; background:var(--bubble); border-bottom-left-radius:4px; }
  .msg.sys { align-self:center; background:transparent; color:var(--dim); font-size:12px; border:1px dashed #333a4d; }
  .msg .who { font-size:11px; color:var(--dim); margin-bottom:3px; }
  .acts { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .act { background:#2d3350; color:var(--text); border:1px solid #454e75; border-radius:16px; padding:5px 12px; font-size:13px; cursor:pointer; }
  .act:hover { background:var(--accent); border-color:var(--accent); }
  #inputbar { padding:10px 16px; background:var(--panel); border-top:1px solid #262b3a; display:flex; gap:8px; }
  #input { flex:1; background:#0d0f15; color:var(--text); border:1px solid #333a4d; border-radius:10px; padding:10px 12px; font-size:14px; outline:none; }
  #input:focus { border-color:var(--accent); }
  #send { background:var(--accent); color:#fff; border:none; border-radius:10px; padding:0 18px; font-size:14px; cursor:pointer; }
  #toast { position:fixed; top:60px; left:50%; transform:translateX(-50%); background:#3a2430; color:#ffb3c0; border:1px solid #7c3a4d; border-radius:10px; padding:8px 16px; font-size:13px; display:none; max-width:80vw; z-index:9; }
  #gate { height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; background:var(--bg); }
  #gate h1 { font-size:26px; }
  #gate p { color:var(--dim); font-size:13px; }
  #gate input { background:#0d0f15; color:var(--text); border:1px solid #333a4d; border-radius:10px; padding:10px 14px; width:260px; }
  .splash { color:var(--dim); font-size:12px; align-self:center; text-align:center; padding:20px; }
  .splash code { color:var(--ok); background:#14181f; padding:1px 6px; border-radius:6px; }
</style>
</head>
<body>
<div id="gate" style="display:none">
  <h1>🎮 StoryWorld</h1>
  <p>AI 互动小说世界 · 输入昵称开始（单人私聊 · 房间多人）</p>
  <input id="nickname" maxlength="20" placeholder="你的昵称">
  <button class="ghost" id="goRegister" style="font-size:14px;padding:8px 24px">开始冒险</button>
  <p id="gateErr" style="color:#ff9a9a"></p>
</div>
<div id="main" style="display:none;height:100vh;flex-direction:column">
  <div id="topbar">
    <h1>🎮 StoryWorld</h1>
    <span id="convTitle"></span>
    <span id="meBadge"></span>
    <button class="ghost" id="btnRoom" title="创建多人房间">🏠 建房</button>
    <button class="ghost" id="btnLogout">退出</button>
  </div>
  <div id="chat"><div class="splash">连接中…</div></div>
  <nav aria-label="冒险操作" style="display:flex;gap:8px;flex-wrap:wrap;padding:8px 16px">
    <button class="ghost" onclick="sendText('/scripts')">📜 选择世界</button>
    <button class="ghost" onclick="sendText('/guide')">🧭 目标与玩法</button>
    <button class="ghost" onclick="sendText('/continue')">⏱ 等待5分钟</button>
    <button class="ghost" onclick="sendText('/status')">🧬 角色与背包</button>
    <button class="ghost" onclick="sendText('/resume')">💾 恢复旅程</button>
  </nav>
  <div id="inputbar">
    <input id="input" placeholder="输入行动或选项编号；不知道做什么时输入“怎么玩”" autocomplete="off">
    <button id="send">发送</button>
  </div>
</div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
let me = null, conv = null, ws = null, lastMsgId = 0, reconnectTimer = null, closedByUser = false;

async function api(path, opts) {
  const r = await fetch(path, Object.assign({headers:{"Content-Type":"application/json"}}, opts));
  if (r.status === 401) { showGate(); throw new Error("unauth"); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || ("HTTP " + r.status));
  return data;
}

function showGate() {
  $("#main").style.display = "none";
  $("#gate").style.display = "flex";
}
function showMain() {
  $("#gate").style.display = "none";
  $("#main").style.display = "flex";
}

function convLabel(c) {
  if (c.startsWith("r:")) return "🏠 房间 #" + c.slice(2);
  return "💬 个人世界";
}

async function init() {
  try { me = await api("/api/web/me"); } catch (e) { showGate(); return; }
  showMain();
  $("#meBadge").textContent = me.nickname;
  const params = new URLSearchParams(location.search);
  conv = params.get("conv") || ("u:" + me.id);
  $("#convTitle").textContent = convLabel(conv);
  document.title = convLabel(conv) + " · StoryWorld";
  await loadHistory(0);
  connect();
}

async function loadHistory(after) {
  const list = await api("/api/web/conv/" + encodeURIComponent(conv) + "/messages?after=" + after);
  list.forEach(m => render(m));
  $("#chat").scrollTop = $("#chat").scrollHeight;
}

function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML;}

function render(m) {
  const box = document.createElement("div");
  box.className = "msg " + (m.role === "user" ? "user" : m.role === "sys" ? "sys" : "bot");
  if (m.sender && m.role === "user") box.innerHTML = '<div class="who">' + esc(m.sender) + "</div>";
  box.appendChild(document.createTextNode(m.text));
  if (m.actions && m.actions.length) {
    const acts = document.createElement("div"); acts.className = "acts";
    m.actions.forEach(a => {
      const b = document.createElement("button");
      b.className = "act"; b.textContent = a.label;
      b.onclick = () => sendAction(a.payload);
      acts.appendChild(b);
    });
    box.appendChild(acts);
  }
  $("#chat").appendChild(box);
  $("#chat").scrollTop = $("#chat").scrollHeight;
  lastMsgId = Math.max(lastMsgId, m.id || 0);
}

function toast(text, alert) {
  const t = $("#toast");
  t.textContent = text;
  t.style.display = "block";
  t.style.background = alert ? "#3a2430" : "#233d30";
  t.style.color = alert ? "#ffb3c0" : "#a8e6c8";
  t.style.borderColor = alert ? "#7c3a4d" : "#3d7c5a";
  setTimeout(() => t.style.display = "none", 2600);
}

function connect() {
  closedByUser = false;
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(proto + "://" + location.host + "/ws/web?conv=" + encodeURIComponent(conv));
  ws.onopen = () => { $("#chat").insertAdjacentHTML("beforeend", '<div class="splash">— 已连接 · ' + esc(convLabel(conv)) + ' —</div>'); $("#chat").scrollTop = $("#chat").scrollHeight; };
  ws.onmessage = e => {
    const d = JSON.parse(e.data);
    if (d.type === "hello") { me = d.me; $("#meBadge").textContent = me.nickname; }
    else if (d.type === "msg") render(d);
    else if (d.type === "ack") { if (d.text) toast(d.text, d.alert); }
    else if (d.type === "redirect") {
      location.href = "/web?conv=" + encodeURIComponent(d.conv);
    }
  };
  ws.onclose = () => {
    if (!closedByUser && !reconnectTimer) {
      reconnectTimer = setTimeout(() => { reconnectTimer = null; connect(); }, 2000);
    }
  };
}

function sendText(text) {
  text = (text || "").trim();
  if (!text || !ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({type:"text", text}));
  $("#input").value = "";
}
function sendAction(payload) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({type:"action", payload}));
}

$("#send").onclick = () => sendText($("#input").value);
$("#input").addEventListener("keydown", e => { if (e.key === "Enter") sendText($("#input").value); });

$("#goRegister").onclick = async () => {
  const nickname = $("#nickname").value.trim();
  if (!nickname) return;
  try {
    await api("/api/web/register", {method:"POST", body:JSON.stringify({nickname})});
    location.reload();
  } catch (e) { $("#gateErr").textContent = e.message; }
};
$("#nickname").addEventListener("keydown", e => { if (e.key === "Enter") $("#goRegister").click(); });

$("#btnLogout").onclick = async () => { closedByUser = true; await api("/api/web/logout", {method:"POST"}); location.href = "/web"; };

$("#btnRoom").onclick = async () => {
  try {
    const r = await api("/api/web/room", {method:"POST", body:JSON.stringify({name:""})});
    location.href = "/web?conv=" + encodeURIComponent(r.conv);
  } catch (e) { toast(e.message, true); }
};

init();
</script>
</body>
</html>
