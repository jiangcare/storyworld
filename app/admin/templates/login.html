<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 - StoryWorld 管理后台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card { width: 100%; max-width: 380px; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="card shadow">
      <div class="card-body p-4">
        <h4 class="text-center mb-4">🎮 StoryWorld 管理后台</h4>
        {% if msg %}<div class="alert alert-success py-2">{{ msg }}</div>{% endif %}
        {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
        <form method="post" action="/admin/login">
          <div class="mb-3">
            <label class="form-label">用户名</label>
            <input type="text" name="username" class="form-control" value="{{ username or '' }}" required autofocus autocomplete="username">
          </div>
          <div class="mb-3">
            <label class="form-label">密码</label>
            <input type="password" name="password" class="form-control" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary w-100">登 录</button>
        </form>
      </div>
    </div>
    <p class="text-center text-white-50 mt-3 small">默认账号 admin / admin123（首次启动自动创建）</p>
  </div>
</body>
</html>
