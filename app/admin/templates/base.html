<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}StoryWorld 管理后台{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f5f6f8; }
    .table td, .table th { vertical-align: middle; }
    pre.json-pre {
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 6px;
      padding: 12px;
      font-size: 13px;
      max-height: 520px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .stat-card .num { font-size: 1.6rem; font-weight: 700; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold" href="/admin">🎮 StoryWorld 管理后台</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNav" aria-controls="adminNav" aria-expanded="false" aria-label="切换导航">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="adminNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link {% if active == 'dashboard' %}active{% endif %}" href="/admin">仪表盘</a></li>
        <li class="nav-item"><a class="nav-link {% if active == 'scripts' %}active{% endif %}" href="/admin/scripts">剧本</a></li>
        <li class="nav-item"><a class="nav-link {% if active == 'worlds' %}active{% endif %}" href="/admin/worlds">世界</a></li>
        <li class="nav-item"><a class="nav-link {% if active == 'users' %}active{% endif %}" href="/admin/users">用户</a></li>
      </ul>
      <span class="navbar-text text-white-50 me-3">👤 {{ username }}</span>
      <a class="btn btn-outline-light btn-sm" href="/admin/logout">退出登录</a>
    </div>
  </div>
</nav>
<main class="container-fluid px-4 pb-5">
  {% if msg %}<div class="alert alert-success alert-dismissible fade show" role="alert">{{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="关闭"></button></div>{% endif %}
  {% if err %}<div class="alert alert-danger alert-dismissible fade show" role="alert">{{ err }}<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="关闭"></button></div>{% endif %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
