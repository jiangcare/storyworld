name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---------- 离线测试：真实 SQLite 文件库，无需外部服务/API Key ----------
  tests-offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile check
        run: python -m compileall -q app tests seed.py smoke_test.py run_bot.py run_admin.py run_web.py start_all.py backup_db.py
      - name: Engine smoke test
        run: python smoke_test.py
      - name: Channel / GameFlow test
        run: python tests/flow_test.py
      - name: Web channel test
        run: python tests/web_test.py
      - name: Rules engine test
        run: python tests/rules_test.py
      - name: Entities data test
        run: python tests/entities_test.py
      - name: Narrative transaction test
        run: python tests/narrative_test.py
      - name: SQLite integration test
        run: python tests/sqlite_test.py
      - name: Admin panel test
        run: python tests/admin_test.py
      - name: Local persistence and concurrency test
        run: python tests/local_storage_test.py
      - name: AI backend adapter test
        run: python tests/harness_test.py

  harness-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned official Harness SDK and runtime
        run: pip install -r requirements-harness.txt
      - name: Verify runtime against local DeepSeek API fixture
        env:
          STORYWORLD_TEST_HARNESS_RUNTIME: "1"
        run: python tests/harness_test.py
